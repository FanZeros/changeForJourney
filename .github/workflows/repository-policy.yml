name: 仓库文件规范

on:
  pull_request:
    branches: [workspace930]
  push:
    branches: [workspace930]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-policy-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-policy:
    name: repository-policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 固定可信版本；不持久化凭据，不使用 pull_request_target 执行 PR 代码。
      - name: 拉取待检查版本
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 运行规范校验器回归
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s .github/scripts -p 'test_repository_policy.py' -v

      # 必需检查不设 paths 过滤，避免无相关文件的 PR 永久 Pending。
      - name: 检查已提交文件与身份漂移
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PYTHONDONTWRITEBYTECODE: "1"
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA=$(git rev-parse HEAD)
          fi
          python3 .github/scripts/repository_policy.py --base "$BASE_SHA" --github-actions
